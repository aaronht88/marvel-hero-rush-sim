<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>進入召喚界 — MARVEL HERO RUSH</title>
  <meta name="theme-color" content="#06100d" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <button class="audio-btn" id="audioBtn" aria-label="音效設定">
    <span aria-hidden="true">♪</span> 音效
  </button>

  <main class="shell">
    <section class="shell-left">
      <header>
        <p class="eyebrow">CARD BATTLE RPG · GRIFF CHRONICLE</p>
        <div class="logo-block">
          <h1 class="logo-moz" style="font-size:64px;">MHR<span class="logo-tag">「再現」</span></h1>
          <div class="subtitle-line">
            <span>THE MIRACLE OF THE ZONE</span>
            <span id="versionLabel">V2026.10.15</span>
          </div>
        </div>
      </header>

      <aside class="progress" id="progress" aria-label="玩家進度">
        <div class="row">
          <span class="label">SUMMONER LEVEL</span>
          <span class="value" id="levelVal">LV 1</span>
        </div>
        <div class="row">
          <span class="label">MEDAL</span>
          <span class="value mono" id="medalVal" style="font-size:14px;">0 / 35</span>
        </div>
        <div class="row">
          <span class="label">CARD ARCHIVE</span>
          <span class="value" id="archiveVal">0 / 0</span>
        </div>
        <div class="bar"><div class="bar-fill" id="archiveBar" style="width:0%"></div></div>
        <div class="row">
          <span class="label">SHELL</span>
          <span class="value gold" id="shellVal">$ 300</span>
        </div>
      </aside>

      <nav class="menu" aria-label="主選單">
        <button class="menu-btn" data-action="chronicle">
          <span class="num">01</span>
          <span>
            <div class="label-zh">故事模式</div>
            <div class="label-en">CHRONICLE</div>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="menu-btn locked" data-action="online" disabled>
          <span class="num">02</span>
          <span>
            <div class="label-zh">網上對戰</div>
            <div class="label-en">ONLINE ARENA</div>
          </span>
          <span class="chevron">·</span>
        </button>
        <button class="menu-btn" data-action="shop">
          <span class="num">03</span>
          <span>
            <div class="label-zh">貝獸卡店</div>
            <div class="label-en">CARD SHOP</div>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="menu-btn" data-action="archive">
          <span class="num">04</span>
          <span>
            <div class="label-zh">資料說明</div>
            <div class="label-en">DATABASE &amp; GUIDE</div>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="menu-btn" data-action="deck">
          <span class="num">05</span>
          <span>
            <div class="label-zh">編成卡組</div>
            <div class="label-en">DECK FORMATION</div>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="menu-btn" data-action="settings">
          <span class="num">06</span>
          <span>
            <div class="label-zh">設定</div>
            <div class="label-en">SETTINGS</div>
          </span>
          <span class="chevron">›</span>
        </button>
      </nav>

      <footer class="shell-footer">
        <a href="index.html" class="mono">← 返回主選單</a>
        <a href="#" id="reportLink">遊戲報錯</a>
      </footer>
    </section>

    <section class="shell-right" aria-hidden="true">
      <div class="hero-canvas">
        <span class="hero-glyph">召</span>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
