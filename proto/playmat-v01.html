<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MHR Playmat Prototype v01</title>
<style>
/* ============================================================
   MHR PLAYMAT PROTOTYPE v01
   依據 Aaron 的 figcraft prototype（MHR_SIM_Proto_v01.figcraft）

   核心設計決定
   1. 斜線分界（由左下到右上）—— 減少頁面高度，唔需滾動就見到雙方
   2. 每方 4 個戰區：FRONT(1) + WING×2(2) + BACK(1)
      距離：FRONT=1 / WING=2 / BACK=3（規則書 P12：R-1→先鋒、R-2→側翼、R-3→後衛）
   3. RUSH Point 只顯示分數（不放卡）
   4. Adaptive：用 clamp() + aspect-ratio + container query，唔用固定 px
   ============================================================ */

:root {
  --bg: #0a0f18;
  --mat-ai: rgba(150, 40, 55, .30);
  --mat-p:  rgba(30, 90, 160, .30);
  --line: rgba(120, 170, 230, .22);
  --line-strong: rgba(120, 190, 255, .55);
  --text: #dce8f7;
  --muted: rgba(190, 212, 238, .62);
  --cyan: #22d3ee;
  --amber: #f5b942;
  --card-ratio: 0.716;      /* 真卡 63×88mm */
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, "Segoe UI", "Noto Sans HK", sans-serif;
  overflow: hidden;                /* 唔滾動 —— 斜排就是為此 */
  -webkit-font-smoothing: antialiased;
}

/* ---------- 主容器：斜線切分 ---------- */
#mat {
  position: relative;
  width: 100vw; height: 100dvh;
  overflow: hidden;
  isolation: isolate;
}

/* 兩個斜切半場。用 clip-path 由左下到右上切。
   AI 側（上）= 紅，Player 側（下）= 藍。 */
.half {
  position: absolute; inset: 0;
  pointer-events: none;
}
.half-ai {
  background: linear-gradient(200deg, #2a0d14 0%, var(--mat-ai) 55%, transparent 78%);
  clip-path: polygon(0 0, 100% 0, 100% 62%, 0 30%);
}
.half-p {
  background: linear-gradient(20deg, #08161f 0%, var(--mat-p) 55%, transparent 78%);
  clip-path: polygon(0 30%, 100% 62%, 100% 100%, 0 100%);
}

/* 斜線本身（視覺引導） */
.divider {
  position: absolute; left: 0; right: 0;
  top: 48.5%; height: 2px;
  /* 中央留空：RUSH pill 佔住中間，斜線自動斷開，視覺上唔會穿過計分 */
  background: linear-gradient(90deg,
    transparent 0%, var(--line-strong) 12%, var(--cyan) 30%,
    transparent 38%, transparent 62%,
    var(--cyan) 70%, var(--line-strong) 88%, transparent 100%);
  transform-origin: center;
  transform: rotate(-16deg);
  opacity: .5;
  pointer-events: none;
  z-index: 2;
}

/* ---------- 半場內容容器 ---------- */
.side {
  position: absolute;
  left: 0; right: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.15fr);
  gap: clamp(4px, .8vmin, 10px);
  padding: clamp(4px, .8vmin, 10px) clamp(8px, 1.6vmin, 22px);
  align-items: center;
  z-index: 3;
}
/* AI 半場：只佔上半，中央柱靠上（貼近斜線） */
.side-ai {
  top: 0; height: 48.5%;
  grid-template-rows: 1fr;
  align-items: end;
}
/* Player 半場：只佔下半，中央柱靠下 */
.side-p {
  bottom: 0; height: 48.5%;
  grid-template-rows: 1fr;
  align-items: start;
}

/* ---------- 戰區網格 ----------
   佈局（每方）：
        WING   [FRONT]   WING      ← 前線（貼近中央斜線）
        ─────────────────────
               [BACK]              ← 後方（遠離中央）
   FRONT 同 BACK 分開兩行，避免 BACK 塞入中央柱同 RUSH 撞。 */
.battlefield {
  display: grid;
  grid-template-columns: auto auto auto;
  grid-template-rows: auto auto;
  gap: clamp(3px, .6vmin, 7px);
  justify-content: center;
  align-items: center;
  justify-items: center;
}
/* FRONT 喺中間行，WING 喺左右同高 */
.battlefield .slot-front { grid-column: 2; grid-row: 1; }
.battlefield .zone-wing  { grid-row: 1; }
.battlefield .zone-wing[data-slot="wing1"] { grid-column: 1; }
.battlefield .zone-wing[data-slot="wing2"] { grid-column: 3; }
/* BACK 居中放第二行 */
.battlefield .slot-back { grid-column: 2; grid-row: 2; }
/* AI 側鏡像：BACK 喺 FRONT 上面（遠離斜線） */
.side-ai .battlefield { direction: rtl; }
.side-ai .battlefield > * { direction: ltr; }
.side-ai .battlefield .slot-back { grid-row: 2; }

.zone {
  position: relative;
  border: 1px dashed var(--line);
  border-radius: clamp(6px, 1vmin, 12px);
  background: rgba(8, 16, 28, .45);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.zone::after {
  content: attr(data-label);
  position: absolute;
  font-size: clamp(7px, .85vmin, 11px);
  letter-spacing: .08em;
  /* v01.1: 之前用 --muted 喺深底太淡，加陰影 + 提亮 */
  color: rgba(180, 215, 255, .78);
  text-shadow: 0 1px 3px rgba(0, 0, 0, .9);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 1;
}

/* 卡槽尺寸：用卡比例 + container 高度自適應 */
.slot {
  aspect-ratio: var(--card-ratio);
  height: clamp(44px, 9.5vmin, 116px);
  width: auto;
}
/* FRONT 最前，視覺上比其他大少少 */
.slot-front { height: clamp(50px, 10.5vmin, 128px); }
.slot-back  { height: clamp(40px, 8.5vmin, 104px); }
.slot-wing  { height: clamp(44px, 9vmin, 110px); }

/* 卡槽內的假卡（prototype 用） */
.card {
  width: 100%; height: 100%;
  border-radius: clamp(5px, .8vmin, 9px);
  background: linear-gradient(160deg, #1b2c46, #0d1826);
  border: 1px solid rgba(120, 180, 240, .28);
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: clamp(2px, .4vmin, 5px);
  font-size: clamp(6px, .72vmin, 9px);
  line-height: 1.15;
  color: var(--muted);
}
.card .c-num { font-size: .9em; opacity: .7; }
.card .c-stats { display: flex; gap: 2px; flex-wrap: wrap; }
.card .chip {
  padding: 0 2px; border-radius: 2px;
  background: rgba(90, 140, 200, .28);
  font-size: .9em;
}
.card.empty {
  background: repeating-linear-gradient(45deg, rgba(60,90,130,.08) 0 6px, transparent 6px 12px);
  border-style: dashed; border-color: rgba(120,170,230,.16);
  pointer-events: none;
}

/* ---------- 側邊細區（VOID / RETREAT / DECK）---------- */
.side-zones {
  display: flex; flex-direction: column;
  gap: clamp(4px, .7vmin, 9px);
  align-items: stretch;
  min-width: 0;
}
.pile {
  position: relative;
  border: 1px solid var(--line);
  border-radius: clamp(5px, .9vmin, 10px);
  background: rgba(8, 14, 26, .55);
  padding: clamp(3px, .5vmin, 7px);
  display: flex; align-items: center; gap: clamp(3px, .5vmin, 6px);
  font-size: clamp(7px, .8vmin, 10px);
  color: var(--muted);
  cursor: pointer;
  transition: border-color .18s, background .18s;
}
.pile:hover { border-color: var(--line-strong); background: rgba(20, 40, 66, .7); }
.pile .pile-label { letter-spacing: .06em; text-transform: uppercase; }
.pile .pile-count {
  margin-left: auto;      /* 兩側都靠右，讀數一致 */
  min-width: 2.2em;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-weight: 600;
}
.pile .pile-mini {
  width: clamp(16px, 2.4vmin, 26px);
  aspect-ratio: var(--card-ratio);
  border-radius: 2px;
  background: linear-gradient(150deg, #23374f, #0e1a28);
  border: 1px solid rgba(120,180,240,.2);
  flex: none;
}

/* ---------- BASE 6 格 ---------- */
.base-row {
  display: flex;
  gap: clamp(3px, .5vmin, 6px);
  align-items: center;
}
.base-slot {
  aspect-ratio: var(--card-ratio);
  height: clamp(28px, 6vmin, 62px);
  border: 1px dashed rgba(120, 170, 230, .25);
  border-radius: clamp(4px, .7vmin, 8px);
  background: rgba(8, 16, 28, .35);
  flex: none;
}

/* ---------- 中央 RUSH Point ----------
   放喺兩個 FRONT 之間嘅斜線空白帶，唔壓任何 zone。
   只顯示分數（按 Aaron 指示，不放卡）。 */
.rush {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  display: flex; align-items: center; gap: clamp(3px, .6vmin, 9px);
  padding: clamp(2px, .4vmin, 5px) clamp(7px, 1.2vmin, 14px);
  border-radius: 999px;
  background: rgba(6, 12, 22, .92);
  border: 1px solid var(--line-strong);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, .12), 0 6px 22px rgba(0, 0, 0, .65);
  backdrop-filter: blur(8px);
  pointer-events: none;
}
.rush .label {
  font-size: clamp(6px, .68vmin, 9px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}
.rush .score {
  font-size: clamp(11px, 1.7vmin, 19px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.rush .score.p { color: #6db8ff; }
.rush .score.a { color: #ff7b88; }
.rush .vs {
  font-size: clamp(7px, .85vmin, 11px);
  color: var(--muted);
  letter-spacing: .1em;
}

/* ---------- Battle Log ---------- */
.log {
  position: absolute;
  right: clamp(6px, 1.2vmin, 16px);
  top: clamp(6px, 1.2vmin, 16px);
  width: clamp(120px, 19vmin, 240px);
  max-height: 22%;
  overflow: hidden;
  z-index: 8;
  border: 1px solid var(--line);
  border-radius: clamp(6px, 1vmin, 12px);
  background: rgba(4, 8, 14, .90);
  backdrop-filter: blur(8px);
  padding: clamp(4px, .7vmin, 9px);
  font-size: clamp(8px, .86vmin, 11px);
  line-height: 1.5;
  color: var(--muted);
}
.log .log-title {
  font-size: .92em; letter-spacing: .12em;
  text-transform: uppercase; opacity: .6;
  margin-bottom: 3px;
}
.log .log-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log .log-line.hot { color: var(--cyan); }

/* ---------- 動作按鈕（唔佔中央）---------- */
.actions {
  position: absolute;
  z-index: 12;
  display: flex;
  gap: clamp(4px, .7vmin, 8px);
  align-items: center;
}
.actions-p {
  /* 手牌高度 clamp(42px,9vmin,104px) + 少少間距 → actions 要喺手牌之上 */
  left: 50%;
  bottom: calc(clamp(42px, 9vmin, 104px) + clamp(6px, 1vmin, 14px));
  transform: translateX(-50%);
}
.btn {
  border: 1px solid var(--line);
  background: rgba(12, 22, 36, .9);
  color: var(--text);
  border-radius: clamp(5px, .8vmin, 9px);
  padding: clamp(4px, .65vmin, 9px) clamp(8px, 1.3vmin, 16px);
  font-size: clamp(8px, .88vmin, 12px);
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: var(--line-strong); background: rgba(22, 40, 62, .95); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  border-color: rgba(34, 211, 238, .55);
  background: linear-gradient(180deg, rgba(30, 80, 120, .95), rgba(16, 44, 70, .95));
  color: #d9f4ff;
}
.btn.end { border-color: rgba(245, 185, 66, .45); }

/* ---------- 手牌 ---------- */
.hand {
  position: absolute;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  z-index: 9;
  display: flex;
  gap: clamp(2px, .4vmin, 5px);
  align-items: flex-end;
  padding: 0 clamp(8px, 1.5vmin, 20px);
  pointer-events: auto;
}
.hand .h-card {
  aspect-ratio: var(--card-ratio);
  height: clamp(42px, 9vmin, 104px);
  /* v01.1: 手牌多時自動縮，唔會爆出畫面 */
  max-width: calc((100vw - 40px) / 10);
  border-radius: clamp(4px, .7vmin, 8px);
  background: linear-gradient(160deg, #1e3350, #0c1622);
  border: 1px solid rgba(120, 180, 240, .3);
  transition: transform .14s, border-color .14s;
  cursor: pointer;
  flex: none;
}
.hand .h-card:hover {
  transform: translateY(-clamp(6px, 1.4vmin, 16px));
  border-color: var(--cyan);
}

/* ---------- AI 手牌（背面）---------- */
.hand-ai {
  top: 0; bottom: auto; align-items: flex-start;
}
.hand-ai .h-card {
  background: repeating-linear-gradient(45deg, #1a2a3e 0 5px, #12202f 5px 10px);
  border-color: rgba(120, 180, 240, .16);
}
.hand-ai .h-card:hover { transform: translateY(clamp(6px, 1.4vmin, 16px)); }

/* ---------- 距離提示（R-1/R-2/R-3）---------- */
.dist-tag {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(6px, .7vmin, 9px);
  letter-spacing: .06em;
  color: rgba(140, 200, 255, .5);
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}

/* ---------- 細螢幕：直向 ---------- */
@media (orientation: portrait), (max-width: 820px) {
  #mat { overflow: auto; }
  .divider { display: none; }
  .half-ai { clip-path: none; background: linear-gradient(180deg, #2a0d14, transparent 70%); }
  .half-p  { clip-path: none; background: linear-gradient(0deg, #08161f, transparent 70%); }
  .side-ai { height: 50%; }
  .side-p  { height: 50%; }
  .side { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  .rush { top: 50%; }
  .log { max-height: 16%; width: clamp(100px, 40vw, 180px); }
  .base-row { flex-wrap: wrap; justify-content: center; }
}

/* ---------- 大螢幕：放大卡槽 ---------- */
@media (min-width: 1500px) {
  .slot-front { height: clamp(100px, 12vmin, 175px); }
  .slot-back  { height: clamp(84px, 10vmin, 148px); }
  .slot-wing  { height: clamp(90px, 10.5vmin, 155px); }
}

/* ---------- hover 卡效 banner ---------- */
#card-pop {
  position: fixed;
  z-index: 130;
  width: clamp(220px, 26vw, 340px);
  max-height: 44vh;
  overflow-y: auto;
  padding: clamp(7px, 1vmin, 12px);
  border-radius: clamp(8px, 1.2vmin, 13px);
  background: linear-gradient(180deg, #0f1d38, #0a1424);
  border: 1px solid rgba(0, 229, 255, .38);
  box-shadow: 0 12px 34px rgba(0, 0, 0, .7);
  font-size: clamp(9px, .95vmin, 12px);
  line-height: 1.5;
  pointer-events: none;
  backdrop-filter: blur(6px);
}
#card-pop[hidden] { display: none; }
#card-pop .cb-name { font-weight: 700; margin-bottom: 4px; }
#card-pop .cb-stats { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 6px; }
#card-pop .cb-chip {
  padding: 1px 4px; border-radius: 3px; font-size: .88em;
  background: rgba(90, 140, 200, .25); border: 1px solid rgba(120,180,240,.25);
}
#card-pop .cb-effect { white-space: pre-wrap; opacity: .92; font-size: .95em; }
</style>
</head>
<body>

<div id="mat">
  <div class="half half-ai"></div>
  <div class="half half-p"></div>
  <div class="divider"></div>

  <!-- ============ AI 側（上） ============ -->
  <div class="side side-ai">
    <div class="side-zones">
      <div class="pile" data-label="DECK">
        <div class="pile-mini"></div>
        <span class="pile-label">卡組</span>
        <span class="pile-count" id="deck-a">42</span>
      </div>
      <div class="pile" data-label="VOID">
        <span class="pile-label">虛空</span>
        <span class="pile-count" id="void-a">3</span>
      </div>
      <div class="pile" data-label="RETREAT">
        <span class="pile-label">撤退</span>
        <span class="pile-count" id="retreat-a">1</span>
      </div>
    </div>

    <!-- AI 戰區：WING / [FRONT↑ BACK↓] / WING -->
    <div class="battlefield">
      <div class="zone zone-wing slot slot-wing" data-label="WING" data-side="A" data-slot="wing1"></div>
      <div class="zone slot slot-front" data-label="FRONT" data-side="A" data-slot="front"></div>
      <div class="zone zone-wing slot slot-wing" data-label="WING" data-side="A" data-slot="wing2"></div>
      <div class="zone slot slot-back"  data-label="BACK"  data-side="A" data-slot="back"></div>
    </div>

    <div class="side-zones">
      <div class="base-row" id="base-a"></div>
      <div class="dist-tag">R-1 先鋒 · R-2 側翼 · R-3 後衛</div>
    </div>
  </div>

  <!-- ============ Player 側（下） ============ -->
  <div class="side side-p">
    <div class="side-zones">
      <div class="base-row" id="base-p"></div>
      <div class="dist-tag">R-1 先鋒 · R-2 側翼 · R-3 後衛</div>
    </div>

    <div class="battlefield">
      <div class="zone zone-wing slot slot-wing" data-label="WING" data-side="P" data-slot="wing1"></div>
      <div class="zone slot slot-front" data-label="FRONT" data-side="P" data-slot="front"></div>
      <div class="zone zone-wing slot slot-wing" data-label="WING" data-side="P" data-slot="wing2"></div>
      <div class="zone slot slot-back"  data-label="BACK"  data-side="P" data-slot="back"></div>
    </div>

    <div class="side-zones">
      <div class="pile" data-label="RETREAT">
        <span class="pile-label">撤退</span>
        <span class="pile-count" id="retreat-p">0</span>
      </div>
      <div class="pile" data-label="VOID">
        <span class="pile-label">虛空</span>
        <span class="pile-count" id="void-p">0</span>
      </div>
      <div class="pile" data-label="DECK">
        <div class="pile-mini"></div>
        <span class="pile-label">卡組</span>
        <span class="pile-count" id="deck-p">43</span>
      </div>
    </div>
  </div>

  <!-- ============ 中央 RUSH Point（只顯示分數） ============ -->
  <div class="rush">
    <span class="label">Rush</span>
    <span class="score p" id="score-p">3</span>
    <span class="vs">VS</span>
    <span class="score a" id="score-a">9</span>
  </div>

  <!-- ============ Battle Log ============ -->
  <div class="log">
    <div class="log-title">Battle Log</div>
    <div class="log-line hot">Player 號召「Iron Man」到先鋒區</div>
    <div class="log-line">AI 抽 2 張</div>
    <div class="log-line">Player 攻擊 → AI 後衛區</div>
    <div class="log-line">傷害結算：Power 3500 vs 2800</div>
    <div class="log-line">AI 撤退 1 張角色</div>
  </div>

  <!-- ============ AI 手牌 ============ -->
  <div class="hand hand-ai" id="hand-a"></div>

  <!-- ============ Player 手牌 ============ -->
  <div class="hand" id="hand-p"></div>

  <!-- ============ 動作按鈕 ============ -->
  <div class="actions actions-p">
    <button class="btn">蓋放</button>
    <button class="btn">移動</button>
    <button class="btn">攻擊</button>
    <button class="btn">起動</button>
    <button class="btn end">結束回合</button>
    <button class="btn">回報</button>
  </div>
</div>

<div id="card-pop" hidden></div>

<script>
// ---------- prototype 示範資料（真實卡號 + 效果文本，方便睇 hover） ----------
const SAMPLE = [
  { no: 'BP01-001', name: '「Pulse Assembler」Iron Man', lv: 3, p: 3500, r: 2, color: 'Blue',
    feat: 'Avenger', effect: 'TRIG【FIELD】：When this card enters the field by calling, you prune 1 of your opponent\'s characters with Lv2 or below in BATTLE.' },
  { no: 'BP01-003', name: '「Starving」Venom', lv: 4, p: 4000, r: 1, color: 'Red',
    feat: 'Symbiote', effect: 'TRIG【WING】:When your turn ends, if this card did not attack in this turn, 1 of your opponent\'s characters in BATTLE gets Power-X in this turn.' },
  { no: 'BP01-005', name: '「Scarlet Witch」', lv: 2, p: 2000, r: 3, color: 'Red',
    feat: 'Avenger', effect: 'TRIG【HAND】:When your red character attacks, you may discard this card in HAND. If you do, that character gets Power+2000 in this turn.' },
  { no: 'SP01-021', name: '「Spider-Man」', lv: 3, p: 3000, r: 2, color: 'Blue',
    feat: 'Web', effect: 'ACTI【VOID/ONCE PER TURN】:You may place this card from VOID into your BASE.' },
];

function makeCard(s) {
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.no = s.no;
  d.innerHTML = `
    <div class="c-num">${s.no}</div>
    <div class="c-stats">
      <span class="chip">Lv${s.lv}</span>
      <span class="chip">P${s.p}</span>
      <span class="chip">R${s.r}</span>
    </div>`;
  d.addEventListener('mouseenter', () => showPop(s, d));
  d.addEventListener('mouseleave', hidePop);
  return d;
}
function makeEmpty() {
  const d = document.createElement('div');
  d.className = 'card empty';
  return d;
}

// ---------- 填充戰區 ----------
const layout = {
  'A-front': SAMPLE[1], 'A-wing1': SAMPLE[0], 'A-wing2': null, 'A-back': null,
  'P-front': SAMPLE[2], 'P-wing1': null, 'P-wing2': SAMPLE[3], 'P-back': null,
};
document.querySelectorAll('.zone[data-slot]').forEach(z => {
  const key = z.dataset.side + '-' + z.dataset.slot;
  const s = layout[key];
  z.appendChild(s ? makeCard(s) : makeEmpty());
});

// ---------- BASE 6 格 ----------
['base-a', 'base-p'].forEach(id => {
  const row = document.getElementById(id);
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('div');
    b.className = 'base-slot';
    b.title = 'BASE ' + (i + 1);
    row.appendChild(b);
  }
});

// ---------- 手牌 ----------
function fillHand(id, n, faceUp) {
  const h = document.getElementById(id);
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'h-card';
    if (faceUp) c.appendChild(makeCard(SAMPLE[i % SAMPLE.length]));
    else {
      c.addEventListener('mouseenter', () => showPop({ no: '???', name: 'AI 手牌', effect: '（蓋牌，不可查看）' }, c));
      c.addEventListener('mouseleave', hidePop);
    }
    h.appendChild(c);
  }
}
fillHand('hand-p', 6, true);
fillHand('hand-a', 6, false);

// ---------- hover banner ----------
function showPop(s, anchor) {
  const pop = document.getElementById('card-pop');
  pop.innerHTML = `
    <div class="cb-name">${s.name}</div>
    <div class="cb-stats">
      <span class="cb-chip">Lv${s.lv ?? '—'}</span>
      <span class="cb-chip">P${s.p ?? '—'}</span>
      <span class="cb-chip">R${s.r ?? '—'}</span>
      ${s.color ? `<span class="cb-chip">${s.color}</span>` : ''}
      ${s.feat ? `<span class="cb-chip">${s.feat}</span>` : ''}
    </div>
    <div class="cb-effect">${s.effect || '—（無效果文本）'}</div>`;
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  let top = r.top - ph - 10;
  if (top < 8) top = r.bottom + 10;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}
function hidePop() { document.getElementById('card-pop').hidden = true; }
window.addEventListener('scroll', hidePop, true);

// ---------- prototype 標記 ----------
document.title = 'MHR Playmat Prototype v01';
</script>
</body>
